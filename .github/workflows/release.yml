name: release

# Deployment pipeline: push a tag (v*) -> full gate -> build -> PyPI (trusted
# publishing, no stored secrets) -> GitHub Release with the artifacts.
# Local equivalent: `make tag` (runs the same gate first).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # PyPI trusted publishing

jobs:
  release:
    name: gate, build, publish
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff build twine

      - name: Gate - lint
        run: ruff check .

      - name: Gate - format
        run: ruff format --check .

      - name: Gate - tests
        run: pytest

      - name: Build
        run: python -m build

      - name: Verify distributions
        run: twine check dist/*

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c 'from kube_query import __version__; print(__version__)')"
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: tag v$TAG does not match package version $PKG"; exit 1
          fi

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
